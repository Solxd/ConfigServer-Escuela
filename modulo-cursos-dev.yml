server:
  port: 8083
  forward-headers-strategy: framework
  
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

app:
  internal-secret: clave-interna-gateway-2026-sols-ozi

springdoc:
  swagger-ui:
    path: /curso/swagger-ui.html
  api-docs:
    path: /curso/v3/api-docs
---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:h2:mem:cursosdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: false
        default-requeue-rejected: false
