server:
  port: 8081

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: security
              uri: lb://security
              predicates:
                - Path=/api/auth/**

            - id: modulo-alumnos
              uri: lb://modulo-alumnos
              predicates:
                - Path=/alumnos/**

            - id: modulo-cursos
              uri: lb://modulo-cursos
              predicates:
                - Path=/cursos/**

            - id: modulo-administracion
              uri: lb://modulo-administracion
              predicates:
                - Path=/personal/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10
