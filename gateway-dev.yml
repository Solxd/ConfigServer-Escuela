server:
  port: 8081

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: security
              uri: lb://security
              predicates:
                - Path=/api/auth/**

            - id: modulo-alumnos
              uri: lb://modulo-alumnos
              predicates:
                - Path=/alumnos/**

            - id: modulo-cursos
              uri: lb://modulo-cursos
              predicates:
                - Path=/cursos/**

            - id: modulo-administracion
              uri: lb://modulo-administracion
              predicates:
                - Path=/personal/**

            - id: swagger-alumno
              uri: lb://modulo-alumnos
              predicates:
                - Path=/alumno/swagger-ui/**,/alumno/swagger-ui.html,/alumno/v3/api-docs/**
              filters:
                - StripPrefix=1

            - id: swagger-cursos
              uri: lb://modulo-cursos
              predicates:
                - Path=/curso/swagger-ui/**,/curso/swagger-ui.html,/curso/v3/api-docs/**
              filters:
                - StripPrefix=1

            - id: swagger-administracion
              uri: lb://modulo-administracion
              predicates:
                - Path=/administracion/swagger-ui/**,/administracion/swagger-ui.html,/administracion/v3/api-docs/**
              filters:
                - StripPrefix=1
                
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10

jwt:
  secret: MiClaveSecretaSuperSeguraParaElColegio123456

app:
  # Clave compartida entre gateway y micros
  internal-secret: clave-interna-gateway-2026-sols-ozi
