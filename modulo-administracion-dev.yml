server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

app:
  internal-secret: clave-interna-gateway-2026-sols-ozi


spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: MiClaveSecretaSuperSeguraParaElColegio123456

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:h2:mem:administraciondb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
